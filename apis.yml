name: Alpha Biopharma
description: 'Alpha Biopharma is a clinical-stage biopharmaceutical company founded in 2017 and headquartered
  in Shanghai, China, with an additional office in Beijing. The company focuses on the clinical development
  and commercialization of global innovative drugs across oncology and immunotherapy, spanning medical
  affairs, clinical operations, regulatory affairs and commercialization. Its lead product is Zorifertinib
  (formerly AZD-3759, marketed as Zorifer), a next-generation EGFR TKI designed for EGFR mutation positive
  advanced NSCLC patients with central nervous system metastases, which received NMPA approval in November
  2024 as the first EGFR-TKI indicated for lung cancer with brain metastases. Alpha Biopharma also partners
  with Wugen Inc. on universal off-the-shelf memory NK and CAR-T cell therapies. The company raised a
  Series A led by Qiming Venture Partners. Alpha Biopharma publishes a corporate marketing website only
  and operates no public API, developer portal, or software platform.'
